<!doctype html>
<!--
  PROTOTYPE, THROWAWAY. Wayfinder ticket "Prototype the /admin triage workspace".
  Question: how should the /admin triage workspace look and behave, in the Studease design system?
  Plan: three structurally different workspaces (A Triage queue, B Table + drawer, C Status board),
  switchable via ?variant=A|B|C, all on one throwaway page. Data is synthetic and in memory; nothing is saved.
  Run: python3 -m http.server 8124 -d prototypes/admin-workspace  ->  http://localhost:8124/?variant=B
  Round 2: B (Table + drawer) is the user's pick. Ranked bars added on top; Settings holds AI call log, GitHub,
  Priority criteria (now read-only, set once, no versions) and Archive. A and C are kept, rejected, for reference.
  The variants share the same Problem data and the same merge/split behaviour (the behaviour is part of the question,
  so it is identical everywhere); they differ in layout, hierarchy and the main way in.
  AI results are canned: Generate brief, Suggest Solutions, re-scoring and the consistency check only pretend to call the AI.
  Prototype guess to react to: Variant A's "needs attention" rules (New Problems, Problems with new Feature Requests,
  a closed GitHub issue, an override missing) are NOT decided anywhere; they are here to be judged.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studease Admin Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAE0C8; --field:#DED1AC; --card:#F2EAD6; --ink:#2B2318; --muted:#7D7259; --line:#D6C7A1;
  --terracotta:#BC6B47; --slate:#708090; --sage:#838C67; --focus:#D97A4E; --error:#9B4A2C;
  --s1:8px; --sm:12px; --md:16px; --lg:24px; --xl:40px;
  --micro:120ms; --short:220ms; --long:420ms;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.7,0,.84,0); --ease-io:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Fraunces",Georgia,serif;font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:90px}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wordmark{font-family:"Pacifico",cursive;font-size:24px;line-height:1}
.muted{color:var(--muted)}
.label{font-size:11.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.caption{font-size:12px;color:var(--muted)}
.sketch{display:block;background:var(--muted);-webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat}
.sk-books{--src:url(illustrations/coffeeOnBooks.png)}
.sk-cup{--src:url(illustrations/coffeeWithSteam.png)}
.sk-table{--src:url(illustrations/coffeeTable.png)}
.sk-cat{--src:url(illustrations/confusedCat.png)}

/* shared atoms */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;background:var(--field);color:var(--muted);white-space:nowrap}
.pill.High{background:color-mix(in srgb,var(--terracotta) 22%,transparent);color:#8f4c2f}
.pill.Medium{background:color-mix(in srgb,var(--slate) 20%,transparent);color:#4f5c68}
.pill.Low{background:color-mix(in srgb,var(--sage) 22%,transparent);color:#5f6748}
.pill.ai::before{content:"✦";font-size:10px}
.pill.warn{background:color-mix(in srgb,var(--error) 16%,transparent);color:var(--error)}
.cat{font-size:12px;color:var(--muted);font-style:italic}
.btn{border:0;border-radius:999px;padding:8px 15px;font-weight:700;cursor:pointer;background:var(--terracotta);color:#FBF5E8;transition:transform var(--micro) var(--ease-out),opacity var(--micro);white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);padding:6.5px 13.5px}
.btn.quiet{background:var(--field);color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.ghost.sm{padding:3.5px 9.5px}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--terracotta);text-underline-offset:3px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:5px 11px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13.5px}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tab .n{font-weight:400;opacity:.7;margin-left:3px}
select,input[type=text],textarea{background:var(--field);border:1.5px solid transparent;border-radius:10px;padding:6px 10px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--ink)}
textarea{width:100%;min-height:70px;resize:vertical}
.box{background:var(--card);border-radius:16px;padding:var(--md)}
.stack{display:grid;gap:var(--md)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:var(--sm);flex-wrap:wrap}
.empty{text-align:center;padding:var(--xl) var(--md);color:var(--muted)}
.empty .sketch{width:110px;height:110px;margin:0 auto var(--sm)}
.reveal{animation:rise var(--long) var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* detail building blocks (shared content, arranged differently per variant) */
.prio{display:grid;gap:10px}
.prio .levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prio .lv{background:var(--bg);border-radius:12px;padding:10px 12px}
.prio .lv b{font-size:20px;display:block}
.breakdown{width:100%;border-collapse:collapse;font-size:13px}
.breakdown td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.breakdown td.r{white-space:nowrap;font-weight:700;width:1%}
.frs{display:grid;gap:0}
.fr{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.fr:first-child{border-top:0}
.fr h4{font-size:14.5px;font-weight:700}
.fr p{font-size:13.5px;color:var(--muted)}
.fr .why{font-size:12.5px;margin-top:4px}
.fr .why::before{content:"✦ Why it's here: ";font-weight:700;color:var(--terracotta)}
.fr .ups{font-weight:800;text-align:right;white-space:nowrap}
.fr.new h4::after{content:"new";margin-left:6px;font-size:10px;letter-spacing:.8px;text-transform:uppercase;background:var(--terracotta);color:#FBF5E8;border-radius:999px;padding:1px 6px;vertical-align:2px}
.splitbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 12px;margin-top:8px}
.splitbar select{background:#463b2c;color:var(--bg)}
.brief h4{font-size:13px;margin-top:10px}
.brief p,.brief li{font-size:13.5px}
.brief ul{margin:4px 0 0;padding-left:18px}
.cite{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:11px;font-weight:700;margin-left:4px;cursor:help;background:var(--bg)}
.cite.bad{border-color:var(--error);color:var(--error)}
.notice{border-radius:12px;padding:8px 12px;font-size:13px;background:color-mix(in srgb,var(--terracotta) 14%,transparent)}
.notice.err{background:color-mix(in srgb,var(--error) 14%,transparent);color:var(--error)}
.sol{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.sol b{display:block}
.ghline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* secondary screens */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:8px 6px;border-bottom:1.5px solid var(--ink)}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.metric{display:grid;gap:6px}
.metric .big{font-size:40px;font-weight:800;line-height:1}
.metric .bar{height:8px;border-radius:9px;background:var(--field);position:relative;overflow:hidden}
.metric .bar i{position:absolute;inset:0 auto 0 0;background:var(--sage);border-radius:9px}
.metric .bar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.mail{white-space:pre-wrap;font-size:13.5px;background:var(--bg);border-radius:10px;padding:10px 12px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);z-index:40;display:grid;place-items:center;padding:var(--md)}
.modal{background:var(--bg);border-radius:20px;padding:var(--lg);width:min(540px,100%);max-height:88vh;overflow:auto;display:grid;gap:var(--md)}
.modal ul{margin:0;padding-left:18px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--card);cursor:pointer}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:60;opacity:0;transition:opacity var(--short)}
#toast.show{opacity:1}

/* ---------- Variant A: Triage queue (left rail, one Problem in focus) ---------- */
.A{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
.A .rail{background:var(--field);padding:var(--lg) var(--md);display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.A .rail .wordmark{margin-bottom:2px}
.A .rail .caption{margin-bottom:var(--lg)}
.A .rail button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--muted);display:flex;justify-content:space-between;font-weight:600}
.A .rail button[aria-current=true]{background:var(--bg);color:var(--ink)}
.A .rail .sep{height:1px;background:var(--line);margin:10px 0}
.A .rail .badge{background:var(--terracotta);color:#FBF5E8;border-radius:999px;font-size:11px;padding:0 7px;line-height:18px}
.A main{padding:var(--lg) var(--xl);max-width:1100px}
.A .qhead{display:flex;justify-content:space-between;align-items:end;gap:var(--md);margin-bottom:var(--md);flex-wrap:wrap}
.A .qhead h1{font-size:28px}
.A .queue{display:grid;grid-template-columns:270px minmax(0,1fr);gap:var(--lg);align-items:start}
.A .qlist{display:grid;gap:6px;position:sticky;top:var(--lg)}
.A .qitem{text-align:left;border:0;background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;gap:3px;border-left:4px solid transparent}
.A .qitem[aria-current=true]{border-left-color:var(--terracotta);background:#FBF5E8}
.A .qitem b{font-size:14px}
.A .reason{font-size:12px;color:var(--terracotta);font-weight:700}
.A .focus{display:grid;gap:var(--md)}
.A .focus h2{font-size:26px}
.A .decide{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sm)}
.A .decide .box{display:grid;gap:8px;align-content:start}
.A .stepper{display:flex;justify-content:space-between;align-items:center}
.A .all{width:100%;border-collapse:collapse}
.A .all td{padding:9px 6px;border-bottom:1px solid var(--line)}
@media (max-width:900px){.A{grid-template-columns:1fr}.A .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.A .queue,.A .decide{grid-template-columns:1fr}.A main{padding:var(--md)}}

/* ---------- Variant B: Table + drawer (top nav, dense sortable table) ---------- */
.B header{display:flex;align-items:center;gap:var(--lg);padding:var(--sm) var(--lg);border-bottom:1.5px solid var(--ink);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
.B header nav{display:flex;gap:2px;flex-wrap:wrap}
.B header nav button{border:0;background:none;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
.B header nav button[aria-current=true]{color:var(--ink);background:var(--field)}
.B main{padding:var(--md) var(--lg)}
.B .toolbar{display:flex;justify-content:space-between;align-items:center;gap:var(--md);margin-bottom:var(--sm);flex-wrap:wrap}
.B table.pt{width:100%;border-collapse:collapse;font-size:13.5px}
.B .pt th{text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:8px 6px;border-bottom:1.5px solid var(--ink);cursor:pointer;white-space:nowrap}
.B .pt td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.B .pt tr.sel td{background:var(--card)}
.B .pt tr.open td{background:#FBF5E8}
.B .pt td.t{font-weight:700;cursor:pointer}
.B .pt td.num{text-align:right;font-variant-numeric:tabular-nums}
.B .mergebar{position:sticky;bottom:80px;display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 8px 6px 16px;width:max-content;margin:var(--md) auto 0}
.B .drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,100%);background:var(--bg);border-left:1.5px solid var(--ink);z-index:30;overflow:auto;padding:var(--lg);display:grid;gap:var(--md);align-content:start;box-shadow:-12px 0 32px rgba(43,35,24,.12);animation:slide var(--short) var(--ease-out)}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.B .drawer h2{font-size:22px}
.B details summary{cursor:pointer;font-weight:700;padding:6px 0}
/* round 2: ranked bars (ordinal one-hue ramp, validated on the paper surface) */
:root{--lv-High:#6E3520;--lv-Medium:#A85C3B;--lv-Low:#C99272}
.B .top{display:grid;gap:10px;margin-bottom:var(--lg)}
.B .legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.B .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.B .bars{display:grid;grid-template-columns:minmax(140px,240px) minmax(0,1fr);row-gap:2px;column-gap:var(--sm);align-items:center}
.B .bars .name{font-size:13.5px;font-weight:600;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.B .bars .track{position:relative;height:26px;display:flex;align-items:center;cursor:pointer}
.B .bars .track::before{content:"";position:absolute;inset:0 0 0 0;border-left:1.5px solid var(--ink)}
.B .bars .bar{height:18px;border-radius:0 4px 4px 0;transition:opacity var(--micro)}
.B .bars .val{margin-left:8px;font-size:12.5px;white-space:nowrap}
.B .bars .val b{font-weight:800}
.B .bars .row-h:hover .bar,.B .bars .row-h.hl .bar{opacity:.8}
.B .bars .row-h{display:contents}
.B .axis{grid-column:2;position:relative;height:18px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.B .axis span{position:absolute;top:2px;transform:translateX(-50%);white-space:nowrap}
.B .axis span:first-child{transform:none}
.B .pt td.t .cat{display:block;font-weight:400}
.B .subnav{display:flex;gap:4px;margin-bottom:var(--md);border-bottom:1px solid var(--line);padding-bottom:var(--sm)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:7px 10px;border-radius:10px;z-index:70;max-width:260px;display:none;line-height:1.35}

/* ---------- Variant C: Status board (columns by status, full-page Problem) ---------- */
.C{padding:var(--lg)}
.C header{display:flex;justify-content:space-between;align-items:center;gap:var(--md);margin-bottom:var(--md);flex-wrap:wrap}
.C header .left{display:flex;align-items:baseline;gap:var(--md)}
.C .menu{display:flex;gap:6px;flex-wrap:wrap}
.C .menu button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.C .menu button[aria-current=true]{border-color:var(--ink);color:var(--ink)}
.C .board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:var(--md);overflow-x:auto;padding-bottom:8px}
.C .col{background:var(--field);border-radius:18px;padding:var(--sm);display:grid;gap:8px;align-content:start;min-height:300px;border-top:4px solid var(--muted)}
.C .col.Planned{border-top-color:var(--slate)} .C .col.progress{border-top-color:var(--terracotta)} .C .col.review{border-top-color:var(--sage)}
.C .col.drop{outline:2px dashed var(--terracotta);outline-offset:-4px}
.C .col h3{font-size:15px;display:flex;justify-content:space-between;padding:4px 6px}
.C .card{background:var(--bg);border-radius:12px;padding:10px 12px;display:grid;gap:6px;cursor:grab;border:1.5px solid transparent;transition:transform var(--micro) var(--ease-out)}
.C .card:hover{transform:translateY(-2px)}
.C .card.target{border-color:var(--terracotta)}
.C .card b{font-size:14px}
.C .page{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr);gap:var(--lg);align-items:start}
.C .page h1{font-size:30px}
.C .side{display:grid;gap:var(--md);position:sticky;top:var(--md)}
@media (max-width:900px){.C .page{grid-template-columns:1fr}.C .side{position:static}}

/* ---------- Prototype switcher (not part of the design) ---------- */
#switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:#111;color:#fff;border-radius:999px;padding:6px;font:600 13px/1 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:100}
#switcher button{background:#333;color:#fff;border:0;border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:15px}
#switcher span{padding:0 12px;min-width:210px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<div id="tip" role="tooltip"></div>
<div id="switcher" aria-label="Prototype variant switcher">
  <button id="prev" aria-label="Previous variant">←</button>
  <span id="vlabel"></span>
  <button id="next" aria-label="Next variant">→</button>
</div>
<script>
// ================= synthetic data (in memory, PROTOTYPE) =================
const CATEGORIES = ["Finding spots","Adding & editing spots","Spot details","Visits","Profile & account","Social","Other"];
const STATUSES = ["New","Under review","Planned","In progress","Shipped","Won't do"];
const OPEN = ["New","Under review","Planned","In progress"];
const GOALS = ["Help students find new study spots","Make students come back","Grow the social side"];
const CRIT = {fit:["Strategic fit",30],reach:["Reach",30],pain:["Pain",25],ret:["Retention risk",15]};
const LEVEL_DESC = {
  pain:["Nice to have; the app works fine without it","Minor annoyance, easy workaround","Noticeable friction in a regular task; clumsy workaround","Makes a core task hard or unreliable","Blocks a core task, or makes the app unusable for some students"],
  fit:["Serves none of the goals","Touches a goal only indirectly","Clearly supports one goal in a small way","Directly advances one goal","Substantially advances a goal, or advances more than one"],
  ret:["No sign anyone would leave","Mild frustration, no talk of leaving","Says they use the app less or avoid a feature","Mentions switching to another app or tool","Says they've stopped using or uninstalled Studease"]
};
const P = (id,title,cat,status,ai,priority,extra={})=>({id,title,cat,status,ai,priority,overrideReason:"",brief:"none",gh:null,seenFrs:null,version:1,...extra});
let problems = [
  P("p1","Filter spots by how quiet they are","Finding spots","Planned",{fit:[4,"Directly helps students find a spot that suits studying (goal 1)."],pain:[4,"Several say they walk to a spot and leave because it's too loud."],ret:[3,"Two say they use the app less because results are 'useless for studying'."]},"High",{gh:{n:212,closed:false},brief:"fresh",seenFrs:["r1","r2","r3","r4"]}),
  P("p2","Know if a spot has power outlets","Spot details","Under review",{fit:[3,"Supports finding a usable spot (goal 1) in a small way."],pain:[3,"Laptop users mention clumsy workarounds like asking staff."],ret:[2,"Frustration, no talk of leaving."]},"Medium",{seenFrs:["r6","r7"]}),
  P("p3","See where friends are studying","Social","Under review",{fit:[5,"Advances the social goal and brings students back (goals 2 and 3)."],pain:[2,"Workaround is texting friends."],ret:[2,"No talk of leaving."]},"Medium",{seenFrs:["r9","r10","r11"]}),
  P("p4","Use the map without internet","Finding spots","Under review",{fit:[3,"Helps finding spots on campus with weak signal (goal 1)."],pain:[4,"Map is blank in basements and libraries with poor signal."],ret:[3,"One says they 'stopped bothering' in the library."]},"Low",{overrideReason:"Needs native offline storage; too big for this term.",seenFrs:["r13","r14"]}),
  P("p5","Correct a spot's opening hours","Adding & editing spots","Planned",{fit:[3,"Keeps spot data trustworthy, small support for goal 1."],pain:[4,"Students arrive at closed spots."],ret:[3,"Says they double-check on Google instead."]},"Medium",{seenFrs:["r15","r16"]}),
  P("p6","Track study streaks from visits","Visits","In progress",{fit:[4,"Directly gives students a reason to come back (goal 2)."],pain:[1,"Nice to have."],ret:[2,"No talk of leaving."]},"Medium",{gh:{n:198,closed:true},seenFrs:["r18","r19","r20"]}),
  P("p7","Find quiet places to work","Finding spots","New",{fit:[4,"Directly helps finding a spot to study (goal 1)."],pain:[3,"Friction when spots turn out loud."],ret:[2,"No talk of leaving."]},"",{seenFrs:[]}),

      <div class="stack" style="gap:6px"><span class="label">Keep which title, category, status and Priority?</span>${ps.map((p,i)=>`<label class="opt"><input type="radio" name="keep" value="${p.id}" ${i===0?"checked":""}><span><b>${esc(p.title)}</b><br><span class="caption">${esc(p.cat)} · ${esc(p.status)} · Priority ${p.priority||"not set"}</span></span></label>`).join("")}</div>
      <div><span class="label">What happens</span><ul>
        <li>All ${all.length} Feature Requests and their ${all.reduce((a,f)=>a+f.ups,0)} Upvotes move to the kept Problem. Requesters notice nothing except more Related requests.</li>
        <li>The other Problem${ps.length>2?"s are":" is"} removed (logged in the decision log, not the Archive).</li>
        <li>Reach is recounted and the AI re-scores Pain, Strategic fit and Retention risk.</li>

        <li>Each Feature Request's first AI-given Problem is kept, so the metrics still score the AI's first answer.</li></ul></div>
      <div class="row"><button class="btn" data-act="doMerge">Merge</button><button class="btn quiet" data-act="close">Cancel</button></div></div></div>`;}

// ================= actions =================
function seen(p){p.seenFrs=frsOf(p.id).map(f=>f.id);}
function rescore(p,msg){toast(msg||`✦ Re-scored: ${rec(p).level} ${rec(p).score}`);}
function act(a,el,ev){
  const id=el.dataset.id, v=el.dataset.v;
  switch(a){
    case "view": ui.view=v; ui.pid=null; ui.sel.clear(); ui.frSel.clear(); break;
    case "tab": ui.tab=v; break;
    case "open": if(ui.drag) return; ui.pid=id; ui.frSel.clear(); if(variant==="A") ui.view="all"; break;
    case "focus": ui.pid=id; ui.frSel.clear(); break;
    case "closeP": ui.pid=null; ui.frSel.clear(); break;
    case "step": {const q=byTab(queue()); const cur=ui.pid?prob(ui.pid):q[0]; const i=q.indexOf(cur)+Number(v); if(q[i]) ui.pid=q[i].id; break;}
    case "done": {const p=prob(id); seen(p); if(p.status==="New") p.status="Under review"; const q=byTab(queue()); ui.pid=q.length?q[0].id:null; ui.frSel.clear(); toast(`“${p.title}” triaged`); break;}
    case "break": ui.showBreak=!ui.showBreak; break;
    case "prio": {const p=prob(id); p.priority=v; if(v===rec(p).level) p.overrideReason=""; break;}
    case "brief": {const p=prob(id); p.brief="loading"; setTimeout(()=>{p.brief="fresh"; log.unshift(["now","Decision Brief","gpt-6.1-sol",p.id,"Citation check: 1 quote not found","7.4 s","$0.011"]); render();},900); break;}
    case "sol": ui.solutions[id]="loading"; setTimeout(()=>{ui.solutions[id]="done"; render();},900); break;
    case "gh": {const p=prob(id); p.gh={n:240+Math.floor(Math.random()*20),closed:false}; toast(`Created GitHub issue #${p.gh.n} in Dustrunner369/studease`); break;}
    case "ship": {const p=prob(id); setShipped(p); break;}
    case "frsel": ui.frSel.has(id)?ui.frSel.delete(id):ui.frSel.add(id); break;
    case "frclear": ui.frSel.clear(); break;
    case "move": {const from=prob(id), to=$("#moveTo").value, moving=frs.filter(f=>ui.frSel.has(f.id));
      let target;
      if(to==="__new"){target=P("p"+(problems.length+1)+"x",moving[0].title,from.cat,"Under review",JSON.parse(JSON.stringify(from.ai)),"",{seenFrs:moving.map(f=>f.id)}); problems.push(target);}
      else target=prob(to);
      moving.forEach(f=>f.pid=target.id); [from,target].forEach(p=>{if(p.brief==="fresh") p.brief="stale";});
      ui.frSel.clear(); rescore(target,`Moved ${moving.length} to “${target.title}”. ✦ Both Problems re-scored; briefs marked out of date.`);
      if(!frsOf(from.id).length){problems=problems.filter(p=>p!==from); ui.pid=target.id;}
      break;}
    case "status": {const p=prob(id); if(el.value==="Shipped") setShipped(p); else {p.status=el.value; if(!isOpen(p)){p.closedAt="today"; ui.pid=null; toast(`Closed as ${p.status}: moved to the Archive`);}} break;}
    case "cat": prob(id).cat=el.value; toast("Category changed: its Feature Requests now list under "+el.value); break;
    case "reason": prob(id).overrideReason=el.value; return; // don't re-render while typing
    case "rename": ui.modal={type:"rename",id}; break;
    case "doRename": prob(id).title=$("#renameInput").value; ui.modal=null; break;
    case "mergeWith": ui.modal={type:"pick",id}; break;
    case "pickNext": {const c=document.querySelector("input[name=mpick]:checked"); if(!c) return; ui.modal={type:"merge",ids:[id,c.value]}; break;}
    case "mergeSel": ui.modal={type:"merge",ids:[...ui.sel]}; break;
    case "selclear": ui.sel.clear(); break;
    case "sel": ui.sel.has(id)?ui.sel.delete(id):ui.sel.add(id); break;
    case "doMerge": doMerge(ui.modal.ids, document.querySelector("input[name=keep]:checked").value); break;
    case "close": ui.modal=null; break;
    case "sort": ui.sort=v; break;
    case "approve": outbox.find(o=>o.id===id).state="approved"; toast("Approved. (Demo: it stays in the outbox, no email is sent.)"); break;
    case "editmail": {const o=outbox.find(o=>o.id===id); o.state=o.state==="editing"?"draft":"editing"; break;}
    case "mailedit": outbox.find(o=>o.id===id).text=el.value; return;
    case "discard": outbox.find(o=>o.id===id).state="discarded"; break;
    case "savecrit": criteriaVersion++; toast(`Saved Priority Criteria v${criteriaVersion}. ✦ Open Problems will be re-scored against it.`); break;
    case "check": ui.checking=true; setTimeout(()=>{ui.checking=false; lastCheck={when:"just now",pct:92,changed:["p4 (Medium → Low)"]}; render();},1200); break;
    case "noop": toast("Not wired in the prototype"); return;
    default: return;
  }
  render();
}
function setShipped(p){
  p.status="Shipped"; p.closedAt="today"; ui.pid=null;
  frsOf(p.id).forEach((f,i)=>outbox.push({id:"o"+Date.now()+i,pid:p.id,to:f.email,fr:f.id,state:"draft",text:`Hi! You asked for “${f.title}”. It's now in Studease: update the app to try it. Thanks for the idea.\n\nThe Studease team`}));
  toast(`Shipped: its Feature Requests leave the portal; ✦ ${frsOf(p.id).length} update drafts are in the Outbox`);
}
function doMerge(ids,keepId){
  const keep=prob(keepId), gone=ids.filter(i=>i!==keepId).map(prob);
  gone.forEach(g=>{frsOf(g.id).forEach(f=>f.pid=keep.id); keep.seenFrs=(keep.seenFrs||[]).concat(g.seenFrs||[]); if(!keep.gh&&g.gh) keep.gh=g.gh;});
  problems=problems.filter(p=>!gone.includes(p)); if(keep.status==="New") keep.status="Under review";
  if(keep.brief==="fresh") keep.brief="stale";
  ui.modal=null; ui.sel.clear(); ui.pid=keep.id; if(variant==="A") ui.view=ui.view==="problems"?"problems":"all";
  rescore(keep,`Merged into “${keep.title}”. ✦ Re-scored: ${rec(keep).level} ${rec(keep).score}`);
}

// ================= wiring =================
const VARIANTS = {B:["Table + drawer · round 2",B],A:["Triage queue · rejected",A],C:["Status board · rejected",C]};
const keys = Object.keys(VARIANTS);
let variant = new URLSearchParams(location.search).get("variant"); if(!VARIANTS[variant]) variant="B";
function render(){
  const focusId=document.activeElement&&document.activeElement.id;
  $("#app").innerHTML = VARIANTS[variant][1]() + modalView();
  $("#vlabel").textContent = `${variant} (${VARIANTS[variant][0]})`;
  document.title = `Admin ${variant} · prototype`;
  if(focusId&&document.getElementById(focusId)) document.getElementById(focusId).focus();
}
function go(d){ variant = keys[(keys.indexOf(variant)+d+keys.length)%keys.length]; history.replaceState(null,"",`?variant=${variant}`); ui.pid=null; ui.view="problems"; ui.sel.clear(); ui.frSel.clear(); ui.modal=null; render(); }
$("#prev").onclick=()=>go(-1); $("#next").onclick=()=>go(1);
document.addEventListener("keydown",e=>{ if(e.target.closest("input,textarea,select,[contenteditable]")) return; if(e.key==="ArrowLeft") go(-1); if(e.key==="ArrowRight") go(1); if(e.key==="Escape"&&ui.modal){ui.modal=null;render();} });
document.addEventListener("click",e=>{ const el=e.target.closest("[data-act]"); if(!el) return; if(el.matches("select,input[type=text],textarea")) return; if(el.classList.contains("scrim")&&e.target.closest("[data-stop]")) return; act(el.dataset.act,el,e); });
document.addEventListener("change",e=>{ const el=e.target.closest("select[data-act]"); if(el) act(el.dataset.act,el,e); });
document.addEventListener("input",e=>{ const el=e.target.closest("input[type=text][data-act],textarea[data-act]"); if(el) act(el.dataset.act,el,e); });
document.addEventListener("focusout",e=>{ if(e.target.matches("input[data-act=reason]")) render(); });
// round 2: hover tooltip on the ranked bars
document.addEventListener("mousemove",e=>{const t=$("#tip"),h=e.target.closest("[data-tip]"); if(!h){t.style.display="none";return;} t.innerHTML=tipText(h.dataset.tip); t.style.display="block"; t.style.left=Math.min(e.clientX+14,innerWidth-275)+"px"; t.style.top=(e.clientY+14)+"px";});
// Variant C drag: change status by dropping on a column, merge by dropping on a card
document.addEventListener("dragstart",e=>{const c=e.target.closest("[data-drag]"); if(c){ui.drag=c.dataset.drag; e.dataTransfer.setData("text/plain",ui.drag);}});
document.addEventListener("dragover",e=>{ if(!ui.drag) return; const card=e.target.closest("[data-drag]"), col=e.target.closest("[data-drop]"); document.querySelectorAll(".target,.drop").forEach(n=>n.classList.remove("target","drop")); if(card&&card.dataset.drag!==ui.drag) card.classList.add("target"); else if(col) col.classList.add("drop"); if(card||col) e.preventDefault(); });
document.addEventListener("drop",e=>{ e.preventDefault(); const id=ui.drag, card=e.target.closest("[data-drag]"), col=e.target.closest("[data-drop]");
  if(card&&card.dataset.drag!==id) ui.modal={type:"merge",ids:[card.dataset.drag,id]};
  else if(col){const p=prob(id); p.status=col.dataset.drop; if(p.status!=="New") seen(p); toast(`“${p.title}” → ${p.status}`);}
  setTimeout(()=>{ui.drag=null;},0); render(); });
document.addEventListener("dragend",()=>{ setTimeout(()=>{ui.drag=null;},0); document.querySelectorAll(".target,.drop").forEach(n=>n.classList.remove("target","drop")); });
render();
</script>
</body>
</html>
